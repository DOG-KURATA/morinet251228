pages:
  stage: deploy
  script:
    - mkdir .public
    - cp -r dist/* .public
    - |
      cat > .public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
        <meta http-equiv="refresh" content="0; url=main/blog-posts.html">
        <title>Redirecting...</title>
      </head>
      <body>
        <p>Redirecting to <a href="main/blog-posts.html">blog-posts</a>...</p>
      </body>
      </html>
      EOF
    - mv .public public
  artifacts:
    paths:
      - public
  only:
    - master
